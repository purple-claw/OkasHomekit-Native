# Apache reverse-proxy for the OKAS Auth API.
#
# The Node.js AuthService listens on 127.0.0.1:8080 (loopback only). Apache
# forwards /api/* requests to it so the mobile app and tools use port 80.
# See runOnce/README-auth.md for setup instructions.

ProxyPass /api/ http://127.0.0.1:8080/api/
ProxyPassReverse /api/ http://127.0.0.1:8080/api/
RequestHeader set X-Forwarded-Proto "http"
